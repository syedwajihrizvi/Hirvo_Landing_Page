            <h2>Select a Document</h2>
            <p class="picker-description">
            Choose a file safely from your Google Drive. We only receive the specific file you select.
            </p>

            <button class="google-picker-button" onclick="handleAuthClick()" id="pick-button">

            </button>

            <div class="security-footer">
                <i class="bi bi-shield-fill-check"></i>
                <span>Secure encrypted connection via Google Auth</span>
            </div>
    </div>
    <div class="google-picker-file-success">
        <i class="bi bi-file-earmark-pdf-fill"></i>
        <i class="bi bi-file-earmark-text-fill"></i>
        <h3>File Selected Successfully!</h3>
        
        <div class="file-info-grid">
            <div>
                <p class="label">Name:</p>
                <p class="value">Report_2024.pdf</p>
            </div>
            <div>
                <p class="label">Type:</p>
                <p class="value">PDF Document</p>
            </div>
            <div>
                <p class="label">Size:</p>
                <p class="value">2.4 MB</p>
            </div>

        </div>
        <button class="pick-new-file-button" onclick="resetFileSelection()">
            <p>Pick a different file</p>
        </button>
        <h4>You may now close this window safely.</h4>
    </div>
